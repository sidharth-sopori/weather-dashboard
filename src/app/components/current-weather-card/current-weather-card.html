@if (weather()) {
  <div class="card current-card">
    <div class="weather-icon-large">{{ getWeatherEmoji(weather()!.icon) }}</div>
    <div class="temp-large">{{ weather()!.temp }}°C</div>
    <div class="description">{{ weather()!.description | titlecase }}</div>
    <div class="location">{{ weather()!.city }}</div>
    <div class="datetime">{{ weather()!.dateTime | date: 'd MMMM y h:mm a' }}</div>
    <button
      type="button"
      class="favorite-btn"
      [class.saved]="isSaved()"
      (click)="toggleFavorite($event)"
      [attr.aria-pressed]="isSaved()"
      [attr.aria-label]="isSaved() ? 'Remove from favorites' : 'Save to favorites'"
    >
      {{ isSaved() ? '★ Saved' : '☆ Save to favorites' }}
    </button>
  </div>
} @else {
  <div class="card current-card loading">Loading...</div>
}
